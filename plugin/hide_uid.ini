; ============================================================================
; EFF-EFMI-Compatibility-Plugin (Hide UID + GUI Control Panel)
; 1 = 开启隐藏, 0 = 保留显示 | 游戏内按 HOME 可随时呼出图形开关面板实时调整
; ============================================================================

[gui]
; 游戏内呼出/收起控制面板热键 (如 HOME, END, F9, Ctrl+HOME 等；填 NONE 禁用面板热键)
toggle_key=HOME
; 面板界面语言: zh (中文) / en (English)
language=zh

[uid]
; 水印 (右下角常驻)
hide_uid=1
hide_ping=0

; 菜单 (ESC 菜单栏)
hide_menu_uid=1
hide_menu_name=0

; 名片 (个人名片 / 好友名片页)
hide_card_uid=1
hide_card_name=1

[eff]
; 修复 DX11 + EFMI 共存模式下按 Ins 打开 EFF 面板崩溃，并保护 3DMigoto res_width/res_height
fix_eff_panel=1
