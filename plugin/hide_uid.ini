; ============================================================================
; Hide UID Lite for Arknights: Endfield (EFF Companion Plugin)
; 放置在 <游戏根目录>\plugin\hide_uid.ini （与 hide_uid.dll 同目录）
; 1 = 隐藏 (勾选), 0 = 保留显示 (不勾选)
; 修改后重启游戏生效
; ============================================================================

[uid]
; 水印 (右下角常驻)
hide_uid=1
hide_ping=0

; 菜单 (ESC 菜单栏)
hide_menu_uid=1
hide_menu_name=0

; 名片 (个人名片 / 好友名片页)
hide_card_uid=1
hide_card_name=1

[eff]
; 修复 DX11 + EFMI 共存模式下按 Ins 打开 EFF 面板崩溃，并保护 3DMigoto res_width/res_height 不被 604x640 覆盖
fix_eff_panel=1
